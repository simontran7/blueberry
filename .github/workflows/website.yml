name: website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time: skip runs queued behind the one in progress, but let it finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 0.5 is the first version that styles GitHub-style callouts (`> [!CAUTION]`)
      MDBOOK_VERSION: 0.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: cargo install --locked --version ${MDBOOK_VERSION} mdbook

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the website
        run: mdbook build website

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
